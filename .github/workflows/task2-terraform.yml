name: Task2 Terraform

on:
  pull_request:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/task2-terraform.yml"
  push:
    branches:
      - main
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/task2-terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Что выполнить"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: task2-terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
  TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
  TF_VAR_zone: ${{ vars.YC_ZONE }}
  TF_VAR_vm_name: ${{ vars.TF_VM_NAME }}
  TF_VAR_cores: ${{ vars.TF_VM_CORES }}
  TF_VAR_memory: ${{ vars.TF_VM_MEMORY }}
  TF_VAR_disk_size: ${{ vars.TF_VM_DISK_SIZE }}
  TF_VAR_disk_type: ${{ vars.TF_VM_DISK_TYPE }}
  TF_VAR_subnet_id: ${{ secrets.YC_SUBNET_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_user: ${{ vars.TF_SSH_USER }}
  TF_VAR_nat: ${{ vars.TF_VM_NAT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2Advanced/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Create backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ vars.TF_BACKEND_BUCKET }}"
          key    = "${{ vars.TF_BACKEND_KEY }}"
          region = "${{ vars.TF_BACKEND_REGION }}"

          endpoints = {
            s3 = "${{ vars.TF_BACKEND_ENDPOINT }}"
          }

          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment: production
    defaults:
      run:
        working-directory: Task2Advanced/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Create backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ vars.TF_BACKEND_BUCKET }}"
          key    = "${{ vars.TF_BACKEND_KEY }}"
          region = "${{ vars.TF_BACKEND_REGION }}"

          endpoints = {
            s3 = "${{ vars.TF_BACKEND_ENDPOINT }}"
          }

          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
